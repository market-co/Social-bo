<body>
<main>
  <h1>Social Promotion Tracker</h1>
  <p class="note">Organize content links and record analytics you obtain through platform-approved tools.</p>

  <form id="trackerForm">
    <label for="platform">Platform</label>
    <select id="platform" required>
      <option>YouTube</option><option>Facebook</option><option>TikTok</option>
      <option>Instagram</option><option>Other</option>
    </select>

    <label for="url">Content link</label>
    <input id="url" type="url" placeholder="https://…" required>

    <label for="views">Views (optional)</label>
    <input id="views" type="number" min="0" placeholder="100000">

    <label for="watch">Watch time in minutes (optional)</label>
    <input id="watch" type="number" min="0" step="any" placeholder="8000">

    <label for="engagement">Notes (optional)</label>
    <input id="engagement" maxlength="200" placeholder="Campaign or analytics notes">

    <button type="submit">Save link</button>
  </form>

  <section class="save">
      
    <h2>Your tracked links</h2>
    <div id="entries" class="empty">No links added yet.</div>
  </section>
</main>

<script>
  const STORAGE_KEY = "social-promotion-tracker-v1";
  const form = document.querySelector("#trackerForm");
  const list = document.querySelector("#entries");

  function loadEntries() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch { return []; }
  }

  function saveEntries(entries) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
  }

  function render() {
    const entries = loadEntries();
    list.replaceChildren();

    if (!entries.length) {
      list.textContent = "No links added yet.";
      list.className = "empty";
      return;
    }

    list.className = "";
    entries.forEach((item, index) => {
      const row = document.createElement("article");
      row.className = "entry";

      const title = document.createElement("strong");
      title.textContent = item.platform + " · " + item.date;

      const link = document.createElement("a");
      link.href = item.url;
      link.textContent = item.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer"

     derect views to link""
  <send watchtime""<1minute=8000watchtime>
      "derect&save all"}

      const metrics = document.createElement("div");
      metrics.className = "metrics";
      metrics.textContent =
        `Views: ${item.views || "—"} · Watch time: ${item.watch || "—"} minutes` +
        (item.notes ? ` · Notes: ${item.notes}` : "");

      const remove = document.createElement("button");
      remove.type = "button";
      remove.className = "delete";
      remove.textContent = "Remove";
      remove.addEventListener("click", () => {
        const updated = loadEntries();
        updated.splice(index, 1);
        saveEntries(updated);
        render();
      });

      row.append(title, document.createElement("br"), link, metrics, remove);
      list.append(row);
    });
  }

  form.addEventListener("submit", event => {
    event.preventDefault();
    const url = document.querySelector("#url").value.trim();

    try {
      const parsed = new URL(url);
      if (!["http:", "https:"].includes(parsed.protocol)) throw new Error();
    } catch {
      alert("Please enter a valid http or https link.");
      return;
    }

    const entries = loadEntries();
    entries.unshift({
      platform: document.querySelector("#platform").value,
      url,
      views: document.querySelector("#views").value,
      watch: document.querySelector("#watch").value,
      notes: document.querySelector("#engagement").value.trim(),
      date: new Date().toLocaleDateString()
    });

    saveEntries(entries);
    form.reset();
    render();
  });

  render();
</script>
</body>
</html>
